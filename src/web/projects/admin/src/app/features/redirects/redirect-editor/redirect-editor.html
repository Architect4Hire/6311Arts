<cms-editor-frame [view]="view">
  @if (loaded()) {
    <form class="form" novalidate (ngSubmit)="save()">
      <fieldset class="fields" [disabled]="busy()">
        <legend class="sr-only">Redirect</legend>
        <ui-field
          label="Old address"
          [required]="true"
          hint="The address on this site that people may still have, starting with / — for example /gallery."
          [error]="errors().fromPath ?? null"
        >
          <input
            uiControl
            name="fromPath"
            autocomplete="off"
            spellcheck="false"
            [attr.maxlength]="limits.fromMaxLength"
            [ngModel]="draft().fromPath"
            (ngModelChange)="patch({ fromPath: $event })"
          />
        </ui-field>

        <ui-field
          label="Leads to"
          [required]="true"
          hint="A page on this site (/exhibitions), or a full https:// address elsewhere."
          [error]="errors().toPath ?? null"
        >
          <input
            uiControl
            name="toPath"
            autocomplete="off"
            spellcheck="false"
            [attr.maxlength]="limits.toMaxLength"
            [ngModel]="draft().toPath"
            (ngModelChange)="patch({ toPath: $event })"
          />
        </ui-field>

        <ui-field
          label="Type"
          hint="Permanent tells search engines the page has moved for good. Temporary keeps the old address."
          [error]="errors().statusCode ?? null"
        >
          <select
            uiControl
            name="statusCode"
            [ngModel]="draft().statusCode"
            (ngModelChange)="patch({ statusCode: +$event })"
          >
            <option [ngValue]="301">Permanent (301)</option>
            <option [ngValue]="302">Temporary (302)</option>
          </select>
        </ui-field>
      </fieldset>

      <div class="actions">
        <cms-save-actions [view]="view" />
        @if (redirect()) {
          <button uiButton type="button" [busy]="deleting()" [disabled]="busy()" (click)="remove()">
            Delete redirect
          </button>
        }
      </div>
    </form>
  }
</cms-editor-frame>
