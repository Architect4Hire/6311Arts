<cms-editor-frame [view]="view">
  @if (loaded()) {
    <div class="layout layout--main">
      <form class="form" novalidate (ngSubmit)="save()">
        <!-- Disabled while a save or command is in flight, so nothing typed then is overwritten by its answer. -->
        <fieldset class="fields" [disabled]="busy()">
          <legend class="sr-only">Class details</legend>
          <ui-field label="Title" [required]="true" [error]="errors().title ?? null">
            <input
              uiControl
              name="title"
              autocomplete="off"
              [attr.maxlength]="limits.titleMaxLength"
              [ngModel]="draft().title"
              (ngModelChange)="rename('title', $event)"
            />
          </ui-field>

          <ui-field label="Web address" [hint]="slugHint()" [error]="errors().slug ?? null">
            <!-- Made from the title on create, never typed: the field only shows it. -->
            <input uiControl name="slug" disabled [value]="draft().slug" />
          </ui-field>

          <ui-field
            label="Summary"
            hint="One or two sentences for the card and search results. Needed to publish."
            [error]="errors().summary ?? null"
          >
            <textarea
              uiControl
              name="summary"
              rows="3"
              [attr.maxlength]="limits.summaryMaxLength"
              [ngModel]="draft().summary"
              (ngModelChange)="patch({ summary: $event })"
            ></textarea>
          </ui-field>

          <div class="pair">
            <ui-field
              label="Kind"
              hint="Printmaking, Drawing, Talk…"
              [error]="errors().classType ?? null"
            >
              <input
                uiControl
                name="classType"
                autocomplete="off"
                [attr.maxlength]="limits.classTypeMaxLength"
                [ngModel]="draft().classType"
                (ngModelChange)="patch({ classType: $event })"
              />
            </ui-field>
            <ui-field label="Level" hint="Beginner, All levels…" [error]="errors().level ?? null">
              <input
                uiControl
                name="level"
                autocomplete="off"
                [attr.maxlength]="limits.levelMaxLength"
                [ngModel]="draft().level"
                (ngModelChange)="patch({ level: $event })"
              />
            </ui-field>
          </div>
        </fieldset>

        <cms-rich-text
          label="More details"
          hint="Shown on the class page below the summary. Headings, bold, italic and lists; the class picture is the hero."
          [value]="draft().body"
          (valueChange)="patch({ body: $event })"
          [disabled]="busy()"
          [error]="errors().body ?? null"
        />

        <cms-class-runs
          [runs]="draft().runs"
          (runsChange)="patch({ runs: $event })"
          [offeringNumber]="offering()?.offeringNumber ?? null"
          [currency]="currency()"
          [disabled]="busy()"
          [error]="errors().runs ?? null"
        />

        <cms-save-actions [view]="view" />
      </form>

      <aside class="side">
        <cms-image-panel
          heading="Hero image"
          noun="class"
          shape="natural"
          [mediaId]="draft().heroMediaId"
          (mediaIdChange)="patch({ heroMediaId: $event })"
          [error]="errors().heroMediaId ?? null"
          [disabled]="busy()"
        />

        @if (offering(); as offering) {
          <cms-publishing-panel
            [lifecycle]="lifecycle"
            [record]="offering"
            [dirty]="dirty()"
            [busy]="busy()"
          />
        }
      </aside>
    </div>
  }
</cms-editor-frame>
