<cms-editor-frame [view]="view">
  @if (loaded()) {
    <div class="layout">
      <form class="form" novalidate (ngSubmit)="save()">
        <!-- Disabled while a save or command is in flight, so nothing typed then is overwritten by its answer. -->
        <fieldset class="fields" [disabled]="busy()">
          <legend class="sr-only">Instructor details</legend>
          <ui-field label="Name" [required]="true" [error]="errors().name ?? null">
            <input
              uiControl
              name="name"
              autocomplete="off"
              [attr.maxlength]="limits.nameMaxLength"
              [ngModel]="draft().name"
              (ngModelChange)="rename('name', $event)"
            />
          </ui-field>

          <ui-field label="Web address" [hint]="slugHint()" [error]="errors().slug ?? null">
            <!-- Made from the name on create, never typed: the field only shows it. -->
            <input uiControl name="slug" disabled [value]="draft().slug" />
          </ui-field>

          <ui-field
            label="What they teach"
            hint="As the site shows it under their name — “Printmaking”, “Talks & art history”."
            [error]="errors().medium ?? null"
          >
            <input
              uiControl
              name="medium"
              [attr.maxlength]="limits.mediumMaxLength"
              [ngModel]="draft().medium"
              (ngModelChange)="patch({ medium: $event })"
            />
          </ui-field>

          <ui-field
            label="Bio"
            hint="Plain text. Leave a blank line between paragraphs."
            [error]="errors().bio ?? null"
          >
            <textarea
              uiControl
              name="bio"
              rows="8"
              [attr.maxlength]="limits.bioMaxLength"
              [ngModel]="draft().bio"
              (ngModelChange)="patch({ bio: $event })"
            ></textarea>
          </ui-field>

          <ui-field
            label="Website"
            hint="The full address, starting https:// — for example https://janedoe.studio."
            [error]="errors().website ?? null"
          >
            <input
              uiControl
              type="url"
              name="website"
              autocomplete="off"
              spellcheck="false"
              inputmode="url"
              [attr.maxlength]="limits.websiteMaxLength"
              [ngModel]="draft().website"
              (ngModelChange)="patch({ website: $event })"
            />
          </ui-field>

          <ui-field
            label="Instagram"
            hint="Their handle, with or without the @."
            [error]="errors().instagram ?? null"
          >
            <input
              uiControl
              name="instagram"
              autocomplete="off"
              spellcheck="false"
              [attr.maxlength]="limits.instagramMaxLength + 1"
              [ngModel]="draft().instagram"
              (ngModelChange)="patch({ instagram: $event })"
            />
          </ui-field>

          <label class="check">
            <input
              type="checkbox"
              name="active"
              [checked]="draft().active"
              (change)="patch({ active: activeBox.checked })"
              #activeBox
            />
            <span>
              <span class="check__label">Teaches at 6311arts now</span>
              <span class="check__hint"
                >Turn off for instructors who no longer teach here. This doesn’t unpublish
                them.</span
              >
            </span>
          </label>
        </fieldset>

        <cms-save-actions [view]="view" />
      </form>

      <aside class="side">
        <cms-image-panel
          heading="Portrait"
          noun="instructor"
          [mediaId]="draft().portraitMediaId"
          (mediaIdChange)="patch({ portraitMediaId: $event })"
          [error]="errors().portraitMediaId ?? null"
          [disabled]="busy()"
        />

        <cms-artist-picker
          heading="Also an artist"
          [artist]="draft().artist"
          (artistChange)="patch({ artist: $event })"
          [disabled]="busy()"
          [error]="errors().artistId ?? null"
        />

        @if (instructor(); as instructor) {
          <cms-publishing-panel
            [lifecycle]="lifecycle"
            [record]="instructor"
            [dirty]="dirty()"
            [busy]="busy()"
          />
        }
      </aside>
    </div>
  }
</cms-editor-frame>
