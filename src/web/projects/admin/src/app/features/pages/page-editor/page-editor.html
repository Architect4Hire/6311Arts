<cms-editor-frame [view]="view">
  @if (loaded()) {
    <div class="layout layout--main">
      <form class="form" novalidate (ngSubmit)="save()">
        <fieldset class="fields" [disabled]="busy()">
          <legend class="sr-only">Page details</legend>
          <ui-field label="Title" [required]="true" [error]="errors().title ?? null">
            <input
              uiControl
              name="title"
              autocomplete="off"
              [attr.maxlength]="limits.titleMaxLength"
              [ngModel]="draft().title"
              (ngModelChange)="rename('title', $event)"
            />
          </ui-field>

          <ui-field label="Web address" [hint]="slugHint()" [error]="errors().slug ?? null">
            <!-- Made from the title on create, never typed: the field only shows it. -->
            <input uiControl name="slug" disabled [value]="draft().slug" />
          </ui-field>
        </fieldset>

        <cms-rich-text
          label="Text"
          hint="Headings, bold, italic and lists. Needed to publish."
          [value]="draft().body"
          (valueChange)="patch({ body: $event })"
          [disabled]="busy()"
          [error]="errors().body ?? null"
        />

        <cms-save-actions [view]="view" />
      </form>

      @if (page(); as page) {
        <aside class="side">
          <cms-publishing-panel
            [lifecycle]="lifecycle"
            [record]="page"
            [dirty]="dirty()"
            [busy]="busy()"
          />
        </aside>
      }
    </div>
  }
</cms-editor-frame>
