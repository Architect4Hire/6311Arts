<cms-forms-tabs />

<cms-list-tools [view]="view" filtersLabel="Filter by handled" />

<cms-list-body [view]="view">
  @if (rows()) {
    <div class="scroll" role="region" aria-label="Messages" tabindex="0">
      <table class="cms-table" [cmsSortable]="sort" [attr.aria-busy]="refreshing() || null">
        <caption class="sr-only">
          Contact messages, sorted by
          {{
            sort.description()
          }}
        </caption>
        <thead>
          <tr>
            <th scope="col" cmsSortHeader="from">From</th>
            <th scope="col" class="wide" cmsSortHeader="message">Message</th>
            <th scope="col" cmsSortHeader="status">Status</th>
            <th scope="col" class="wide" cmsSortHeader="received">Received</th>
          </tr>
        </thead>
        <tbody>
          @for (message of items(); track message.id; let index = $index) {
            <tr>
              <th scope="row">
                <a [routerLink]="['/forms/messages', message.id]" [attr.data-row]="index">{{
                  message.name
                }}</a>
                <span class="email">{{ message.email }}</span>
              </th>
              <td class="wide text">{{ excerpt(message.message) }}</td>
              <td>
                <ui-status-chip [tone]="chipOf(message).tone" [icon]="chipOf(message).icon">{{
                  chipOf(message).label
                }}</ui-status-chip>
              </td>
              <td class="wide">
                <time [attr.datetime]="message.receivedAt">{{ received(message.receivedAt) }}</time>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</cms-list-body>
