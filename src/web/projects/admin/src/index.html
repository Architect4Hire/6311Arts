<!doctype html>
<!-- data-density: the CMS uses @6311/ui's compact spacing (design-system.md, "Admin"). -->
<html lang="en" data-density="compact">
  <head>
    <meta charset="utf-8" />
    <title>6311arts CMS</title>
    <base href="/admin/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- Mirrors --ink: a meta tag cannot read a CSS custom property. -->
    <meta name="theme-color" content="#1b1f23" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <cms-root></cms-root>
  </body>
</html>
